<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{pageDescription}}" />
    <title>{{pageTitle}} | DRISHTI</title>
    <link
      rel="stylesheet"
      href="./node_modules/ux4g-web-components/styles/ux4g.css"
    />
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="./pages.css" />
    <script src="./preferences.js"></script>
  </head>
  <body class="workspace-page">
    <div id="workspace-shell" class="workspace-shell">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Workspace sidebar">
        <a class="app-brand" href="./home.html" aria-label="DRISHTI workspace">
          <span class="app-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <path d="M4 16s4.4-8 12-8 12 8 12 8-4.4 8-12 8S4 16 4 16Z" />
              <circle cx="16" cy="16" r="3.5" />
            </svg>
          </span>
          <span class="sidebar-label app-brand__name">DRISHTI</span>
        </a>

        <button
          class="sidebar-toggle ux4g-icon-btn ux4g-icon-btn-text-primary ux4g-icon-btn-md"
          id="sidebar-toggle"
          type="button"
          aria-label="Expand sidebar"
          aria-controls="sidebar-navigation"
          aria-expanded="false"
          title="Expand sidebar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>

        <a
          class="sidebar-profile"
          href="./profile.html"
          aria-label="Open your profile"{{#nav.profile}}
          aria-current="page"{{/nav.profile}}
        >
          <span class="profile-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
            </svg>
          </span>
          <span class="sidebar-label profile-name">Demo</span>
        </a>

        <nav
          id="sidebar-navigation"
          class="sidebar-navigation"
          aria-label="Main navigation"
          data-active-nav="{{activeNavKey}}"
        >
          <ul>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./home.html"
                data-nav="home"{{#nav.home}} aria-current="page"{{/nav.home}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 11 12 4l8 7" />
                  <path d="M6 10v10h12V10" />
                </svg>
                <span class="sidebar-label">Overview</span>
              </a>
            </li>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./screenings.html"
                data-nav="screenings"{{#nav.screenings}} aria-current="page"{{/nav.screenings}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 7h16M4 12h16M4 17h10" />
                  <path d="M3 4v16" />
                </svg>
                <span class="sidebar-label">Previous screenings</span>
              </a>
            </li>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./profile.html"
                data-nav="profile"{{#nav.profile}} aria-current="page"{{/nav.profile}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
                </svg>
                <span class="sidebar-label">Profile</span>
              </a>
            </li>
          </ul>
          <hr class="sidebar-divider" />
          <ul>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./settings.html"
                data-nav="settings"{{#nav.settings}} aria-current="page"{{/nav.settings}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="3" />
                  <path d="m19 13.5 1.2 1-.9 1.6-1.5-.3a7 7 0 0 1-1.4.8l-.4 1.5h-1.9l-.5-1.5a7 7 0 0 1-1.4-.8l-1.5.3-.9-1.6 1.2-1a6 6 0 0 1 0-1.6l-1.2-1 .9-1.6 1.5.3a7 7 0 0 1 1.4-.8l.5-1.5h1.9l.4 1.5a7 7 0 0 1 1.4.8l1.5-.3.9 1.6-1.2 1a6 6 0 0 1 0 1.6Z" />
                </svg>
                <span class="sidebar-label">Settings</span>
              </a>
            </li>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./guide.html"
                data-nav="guide"{{#nav.guide}} aria-current="page"{{/nav.guide}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M9.6 9a2.5 2.5 0 1 1 4.5 1.5c-.8 1-2.1 1.2-2.1 2.8M12 17h.01" />
                </svg>
                <span class="sidebar-label">Guide</span>
              </a>
            </li>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./results.html"
                data-nav="results"{{#nav.results}} aria-current="page"{{/nav.results}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5 20v-9" />
                  <path d="M12 20V4" />
                  <path d="M19 20v-6" />
                </svg>
                <span class="sidebar-label">Results</span>
              </a>
            </li>
            <li>
              <a
                class="sidebar-link ux4g-btn ux4g-btn-text-neutral ux4g-btn-md"
                href="./about.html"
                data-nav="about"{{#nav.about}} aria-current="page"{{/nav.about}}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 11v5M12 8h.01" />
                </svg>
                <span class="sidebar-label">About</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <div class="workspace-main">
        <header class="workspace-topbar">
          <p class="workspace-topbar__label">
            <span class="topbar-mark" aria-hidden="true"></span>
            {{pageHeading}}
          </p>
          <span class="workspace-topbar__state">
            <span aria-hidden="true"></span>
            Prototype
          </span>
          <span
            id="connection-status"
            class="workspace-topbar__status"
            role="status"
          ></span>
        </header>

        <main class="workspace-content">
{{content}}
        </main>

        <footer class="workspace-footer">
          <span>DRISHTI</span>
          <span>Document quality screening prototype</span>
        </footer>
      </div>
    </div>

{{overlays}}

    <script src="./node_modules/ux4g-web-components/dist/runtime/design-system.js"></script>
    <script src="./api-config.js"></script>
    <script src="./api.js"></script>
    <script src="./status.js"></script>
    <script src="./topbar-status.js"></script>
    <script src="./pages.js"></script>
{{pageScripts}}
  </body>
</html>
